<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Expert v8.3.4 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        
        #login-container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; position: fixed; top: 0; left: 0;
            background-color: var(--bg-color); z-index: 1000;
        }
        .login-card {
            background-color: var(--card-bg); padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px;
            border: 1px solid var(--border);
        }
        .login-card h2 { margin-bottom: 24px; text-align: center; color: var(--text-color); }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background-color: #0f172a; color: #fff;
        }
        .btn-login {
            width: 100%; padding: 12px; background-color: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-login:hover { background-color: var(--primary-hover); }
        .btn-login:disabled { background-color: #475569; cursor: not-allowed; }
        .error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; word-break: break-all; }

        #app-container { display: none; flex-direction: column; min-height: 100vh; }
        header {
            background-color: var(--card-bg); padding: 16px 24px;
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 1.25rem; color: var(--text-color); }
        .user-info { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--text-muted); }
        .btn-logout {
            background: transparent; border: 1px solid var(--danger); color: var(--danger);
            padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .btn-logout:hover { background: var(--danger); color: #fff; }

        main { flex: 1; padding: 24px; max-width: 1200px; width: 100%; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        nav {
            background-color: var(--card-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 12px 0; position: sticky; bottom: 0; z-index: 10;
        }
        .nav-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-btn.active { color: var(--primary); font-weight: bold; }

        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .grid-kpi {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px;
        }
        .kpi-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .kpi-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .kpi-value { font-size: 1.5rem; font-weight: bold; }
        .btn-primary {
            background-color: var(--primary); color: white; border: none; padding: 10px 16px;
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .form-control {
            width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px;
            border: 1px solid var(--border); background-color: #0f172a; color: #fff;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-container">
        <div class="login-card">
            <h2>Financeiro Expert</h2>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="login-senha" placeholder="********">
            </div>
            <button id="btn-entrar" class="btn-login">Entrar</button>
            <div id="login-erro" class="error-msg"></div>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="app-container">
        <header>
            <h1>Financeiro Expert <span style="font-size: 12px; color: var(--primary);">Pro v8.3.4</span></h1>
            <div class="user-info">
                <span id="user-email-display"></span>
                <button id="btn-sair" class="btn-logout">Sair</button>
            </div>
        </header>

        <main>
            <div id="tab-dashboard" class="tab-content active">
                <div class="grid-kpi">
                    <div class="kpi-card">
                        <div class="kpi-title">Saldo Disponível Real</div>
                        <div class="kpi-value" id="kpi-saldo">R$ 0,00</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-title">Receitas do Mês</div>
                        <div class="kpi-value" style="color: var(--success);" id="kpi-receitas">R$ 0,00</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-title">Despesas do Mês</div>
                        <div class="kpi-value" style="color: var(--danger);" id="kpi-despesas">R$ 0,00</div>
                    </div>
                </div>
                <div class="card">
                    <h3>Lançamento Rápido</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-top: 12px;">
                        <input type="text" id="desc-lancamento" class="form-control" placeholder="Descrição">
                        <input type="number" id="valor-lancamento" class="form-control" placeholder="Valor (R$)">
                        <button id="btn-adicionar" class="btn-primary">Adicionar</button>
                    </div>
                </div>
            </div>

            <div id="tab-compras" class="tab-content"><div class="card"><h3>Compras</h3></div></div>
            <div id="tab-metas" class="tab-content"><div class="card"><h3>Metas</h3></div></div>
            <div id="tab-anotacoes" class="tab-content"><div class="card"><h3>Notas</h3></div></div>
            <div id="tab-auditoria" class="tab-content"><div class="card"><h3>Auditoria</h3><div id="lista-historico"></div></div></div>
        </main>

        <nav>
            <button class="nav-btn active" data-aba="dashboard"><span>📊</span> Início</button>
            <button class="nav-btn" data-aba="compras"><span>🛒</span> Compras</button>
            <button class="nav-btn" data-aba="metas"><span>🎯</span> Metas</button>
            <button class="nav-btn" data-aba="anotacoes"><span>📝</span> Notas</button>
            <button class="nav-btn" data-aba="auditoria"><span>📋</span> Auditoria</button>
        </nav>
    </div>

    <!-- SCRIPTS DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP34X2K3BYJXkyNrpGy8l0XyjM-VY8uXY",
            authDomain: "financeiro-5ed97.firebaseapp.com",
            databaseURL: "https://financeiro-5ed97-default-rtdb.firebaseio.com",
            projectId: "financeiro-5ed97",
            storageBucket: "financeiro-5ed97.firebasestorage.app",
            messagingSenderId: "689227262420",
            appId: "1:689227262420:web:a25a067e62b665e3cece41"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUserUid = null;

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const nomeAba = this.getAttribute('data-aba');
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
                document.getElementById('tab-' + nomeAba).classList.add('active');
                this.classList.add('active');
            });
        });

        onAuthStateChanged(auth, (user) => {
            const btnEntrar = document.getElementById('btn-entrar');
            if (btnEntrar) {
                btnEntrar.disabled = false;
                btnEntrar.innerText = "Entrar";
            }

            if (user) {
                currentUserUid = user.uid;
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                document.getElementById('user-email-display').innerText = user.email;
                carregarDadosDoUsuario(user.uid);
            } else {
                currentUserUid = null;
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        document.getElementById('btn-entrar').addEventListener('click', () => {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;
            const erroEl = document.getElementById('login-erro');
            const btnEntrar = document.getElementById('btn-entrar');
            
            erroEl.innerText = "";

            if (!email || !senha) {
                erroEl.innerText = "Preencha o e-mail e a senha.";
                return;
            }

            btnEntrar.disabled = true;
            btnEntrar.innerText = "Entrando...";

            signInWithEmailAndPassword(auth, email, senha)
                .catch((error) => {
                    btnEntrar.disabled = false;
                    btnEntrar.innerText = "Entrar";
                    
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                        erroEl.innerText = "E-mail ou senha incorretos.";
                    } else if (error.code === 'auth/invalid-email') {
                        erroEl.innerText = "Formato de e-mail inválido.";
                    } else if (error.code === 'auth/admin-restricted-operation') {
                        erroEl.innerText = "Erro: Ative o provedor de E-mail/Senha no painel do Firebase.";
                    } else {
                        erroEl.innerText = "Erro: " + error.message;
                    }
                });
        });

        document.getElementById('btn-sair').addEventListener('click', () => {
            signOut(auth);
        });

        document.getElementById('btn-adicionar').addEventListener('click', () => {
            if (!currentUserUid) return;
            const desc = document.getElementById('desc-lancamento').value.trim();
            const valor = parseFloat(document.getElementById('valor-lancamento').value);

            if (!desc || isNaN(valor)) {
                alert("Preencha a descrição e um valor válido.");
                return;
            }

            const novoLancamentoRef = push(ref(db, 'usuarios/' + currentUserUid + '/lancamentos'));
            set(novoLancamentoRef, {
                descricao: desc,
                valor: valor,
                data: new Date().toISOString()
            }).then(() => {
                document.getElementById('desc-lancamento').value = '';
                document.getElementById('valor-lancamento').value = '';
            });
        });

        function carregarDadosDoUsuario(uid) {
            const dadosRef = ref(db, 'usuarios/' + uid + '/lancamentos');
            onValue(dadosRef, (snapshot) => {
                const dados = snapshot.val();
                atualizarInterface(dados);
            });
        }

        function atualizarInterface(lancamentosObj) {
            let totalDespesas = 0;
            const listaHistorico = document.getElementById('lista-historico');
            listaHistorico.innerHTML = '';

            if (!lancamentosObj) {
                document.getElementById('kpi-saldo').innerText = "R$ 0,00";
                document.getElementById('kpi-despesas').innerText = "R$ 0,00";
                listaHistorico.innerHTML = "Nenhum lançamento registrado.";
                return;
            }

            let htmlHistorico = '';
            Object.values(lancamentosObj).forEach(item => {
                totalDespesas += item.valor;
                htmlHistorico += `<div style="padding: 8px 0; border-bottom: 1px solid var(--border);"><strong>${item.descricao}</strong>: R$ ${item.valor.toFixed(2)}</div>`;
            });

            document.getElementById('kpi-saldo').innerText = `R$ ${(-totalDespesas).toFixed(2)}`;
            document.getElementById('kpi-despesas').innerText = `R$ ${totalDespesas.toFixed(2)}`;
            listaHistorico.innerHTML = htmlHistorico;
        }
    </script>
</body>
</html>
