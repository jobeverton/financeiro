    function defaultState(){
      return {version:11,accounts:[{id:uid("acc"),name:"Conta Principal",type:"checking",openingBalance:0}],cards:[],transactions:[],shoppingItems:[],goals:[],notes:[],budgets:[{id:uid("budget"),category:"Alimentação",monthlyLimit:1200},{id:uid("budget"),category:"Moradia",monthlyLimit:2000},{id:uid("budget"),category:"Lazer",monthlyLimit:400}],categories:[...CATEGORIES],settings:{privacyMode:false,showGoals:true,showForecast:true,theme:"dark"}};

        cards:Array.isArray(raw.cards)?raw.cards.slice(0,50).map(c=>({id:clean(c?.id,uid("card")),name:clean(c?.name,"Cartão"),limit:Math.max(0,num(c?.limit)),closingDay:Math.min(31,Math.max(1,Math.round(num(c?.closingDay)||1))),dueDay:Math.min(31,Math.max(1,Math.round(num(c?.dueDay)||10))),paymentAccountId:clean(c?.paymentAccountId)||undefined})):[],
        transactions:Array.isArray(raw.transactions)?raw.transactions.slice(0,10000).map(t=>({id:clean(t?.id,uid("tx")),type:["income","expense","transfer"].includes(t?.type)?t.type:"expense",amount:Math.max(0,num(t?.amount)),category:clean(t?.category,"Outros"),date:clean(t?.date,today()),status:t?.status==="pending"?"pending":"paid",description:clean(t?.description),paymentMethod:["pix","cash","debit","credit","boleto","transfer"].includes(t?.paymentMethod)?t.paymentMethod:"pix",nature:t?.nature==="fixed"?"fixed":"variable",accountId:clean(t?.accountId)||undefined,destinationAccountId:clean(t?.destinationAccountId)||undefined,cardId:clean(t?.cardId)||undefined,installmentGroupId:clean(t?.installmentGroupId)||undefined,installmentNumber:t?.installmentNumber?num(t.installmentNumber):undefined,installmentTotal:t?.installmentTotal?num(t.installmentTotal):undefined,recurrenceGroupId:clean(t?.recurrenceGroupId)||undefined,shoppingItemId:clean(t?.shoppingItemId)||undefined})):[],
        shoppingItems:Array.isArray(raw.shoppingItems)?raw.shoppingItems.slice(0,1000).map(i=>({id:clean(i?.id,uid("shop")),name:clean(i?.name,"Item"),quantity:Math.max(1,Math.round(num(i?.quantity)||1)),unitPrice:Math.max(0,num(i?.unitPrice)),purchased:!!i?.purchased,accountId:clean(i?.accountId)||undefined,category:clean(i?.category,"Alimentação"),transactionId:clean(i?.transactionId)||undefined})):[],
        goals:Array.isArray(raw.goals)?raw.goals.slice(0,200).map(g=>({id:clean(g?.id,uid("goal")),name:clean(g?.name,"Meta"),type:g?.type==="reserve"?"reserve":"goal",target:Math.max(0,num(g?.target)),allocated:Math.max(0,num(g?.allocated)),deadline:clean(g?.deadline)||undefined})):[],
        notes:Array.isArray(raw.notes)?raw.notes.slice(0,1000).map(n=>({id:clean(n?.id,uid("note")),title:clean(n?.title,"Nota"),content:clean(n?.content),priority:["low","medium","high"].includes(n?.priority)?n.priority:"low",dueDate:clean(n?.dueDate)||undefined,completed:!!n?.completed})):[],
        budgets:Array.isArray(raw.budgets)?raw.budgets.slice(0,200).map(b=>({id:clean(b?.id,uid("budget")),category:clean(b?.category,"Outros"),monthlyLimit:Math.max(0,num(b?.monthlyLimit))})):d.budgets,
        categories:Array.isArray(raw.categories)?[...new Set(raw.categories.map(x=>clean(x)).filter(Boolean))].slice(0,100):[...CATEGORIES],
        settings:{privacyMode:!!raw.settings?.privacyMode,showGoals:raw.settings?.showGoals!==false,showForecast:raw.settings?.showForecast!==false,theme:raw.settings?.theme==="light"?"light":"dark"}
      };
    }
    function migrateLegacy(raw){
      if(raw?.version===11) return normalize(raw);
      if(!raw || typeof raw!=="object") throw new Error("Backup inválido");
      const s=defaultState(), accountMap=new Map(), cardMap=new Map(); s.accounts=[]; s.cards=[];
      (Array.isArray(raw.contas)?raw.contas:[]).forEach(a=>{ const name=clean(a?.nome,"Conta"); if(String(a?.tipo||"").toLowerCase().includes("cart")){const id=uid("card");s.cards.push({id,name,limit:Math.max(0,num(a?.saldo)),closingDay:5,dueDay:12});cardMap.set(name,id);}else{const id=uid("acc");const type=String(a?.tipo||"").toLowerCase().includes("invest")?"investment":String(a?.tipo||"").toLowerCase().includes("poup")?"savings":"checking";s.accounts.push({id,name,type,openingBalance:num(a?.saldo)});accountMap.set(name,id);}});
      if(!s.accounts.length)s.accounts=defaultState().accounts;
      s.transactions=(Array.isArray(raw.transacoes)?raw.transacoes:[]).map(t=>{const cardId=cardMap.get(clean(t?.conta));return{id:uid("tx"),type:t?.tipo==="ENTRADA"?"income":"expense",amount:Math.max(0,num(t?.valor)),category:clean(t?.categoria,"Outros"),date:clean(t?.data,today()),status:t?.status==="PENDENTE"||cardId?"pending":"paid",description:clean(t?.obs),paymentMethod:cardId||String(t?.pagamento||"").toLowerCase().includes("crédito")?"credit":"pix",nature:t?.fixa==="FIXA"?"fixed":"variable",accountId:cardId?undefined:accountMap.get(clean(t?.conta))||s.accounts[0]?.id,cardId,installmentNumber:num(t?.parcelas)>1?1:undefined,installmentTotal:num(t?.parcelas)>1?num(t.parcelas):undefined};});
      s.accounts=s.accounts.map(a=>{const impact=s.transactions.reduce((v,t)=>t.accountId===a.id&&t.status==="paid"?v+(t.type==="income"?t.amount:t.type==="expense"?-t.amount:0):v,0);return{...a,openingBalance:a.openingBalance-impact};});
      s.shoppingItems=(Array.isArray(raw.compras)?raw.compras:[]).map(i=>({id:uid("shop"),name:clean(i?.nome,"Item"),quantity:Math.max(1,Math.round(num(i?.qtd)||1)),unitPrice:Math.max(0,num(i?.preco)),purchased:!!i?.comprado,accountId:s.accounts[0]?.id,category:"Alimentação"}));
      s.goals=(Array.isArray(raw.metas)?raw.metas:[]).map(g=>({id:uid("goal"),name:clean(g?.nome,"Meta"),type:g?.tipo==="RESERVA"?"reserve":"goal",target:Math.max(0,num(g?.alvo)),allocated:Math.max(0,num(g?.atual))}));
      s.notes=(Array.isArray(raw.anotacoes)?raw.anotacoes:[]).map(n=>({id:uid("note"),title:clean(n?.titulo,"Nota"),content:clean(n?.texto),priority:n?.prio==="ALTA"?"high":n?.prio==="MEDIA"?"medium":"low",dueDate:clean(n?.dataAlvo)||undefined,completed:false}));

      s.categories=[...new Set([...(Array.isArray(raw.categoriasCustom)?raw.categoriasCustom:[]),...CATEGORIES].map(String))]; return normalize(s);
    }
    function loadState(){
      for(const [key,isLegacy] of [[STORAGE_KEY,false],[RECOVERY_KEY,false],[LEGACY_KEY,true]]){
        try{const raw=localStorage.getItem(key);if(raw)return isLegacy?migrateLegacy(JSON.parse(raw)):normalize(JSON.parse(raw));}catch(e){console.warn("Backup ignorado",e)}

      return defaultState();
    }
    let state=loadState(), view="dashboard", selectedMonth=today().slice(0,7), undoStack=[];
    let txFilters={q:"",type:"all",status:"all"};
    const money=value=>state.settings.privacyMode?"R$ •••••":moneyRaw(value);
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));const label=$("#save-label");if(label){label.textContent="Salvo neste dispositivo";}}
    function commit(mutator,message){undoStack=[...undoStack.slice(-19),clone(state)];state=normalize(mutator(clone(state))||state);applyTheme();save();render();if(message)toast(message);}
    function applyTheme(){document.documentElement.classList.toggle("dark",state.settings.theme==="dark");document.querySelector('meta[name="theme-color"]').content=state.settings.theme==="dark"?"#091018":"#f4f7f9";}
    function accountBalance(accountId){const account=state.accounts.find(a=>a.id===accountId);if(!account)return 0;return state.transactions.reduce((v,t)=>{if(t.status!=="paid")return v;if(t.type==="income"&&t.accountId===accountId)return v+t.amount;if(t.type==="expense"&&t.accountId===accountId)return v-t.amount;if(t.type==="transfer"&&t.accountId===accountId)return v-t.amount;if(t.type==="transfer"&&t.destinationAccountId===accountId)return v+t.amount;return v;},account.openingBalance);}
    function cardOutstanding(cardId){return state.transactions.filter(t=>t.type==="expense"&&t.cardId===cardId&&t.status==="pending").reduce((s,t)=>s+t.amount,0);}
    function summary(key=selectedMonth){
      const period=state.transactions.filter(t=>monthKey(t.date)===key),paidIncome=period.filter(t=>t.type==="income"&&t.status==="paid").reduce((s,t)=>s+t.amount,0),paidExpense=period.filter(t=>t.type==="expense"&&t.status==="paid").reduce((s,t)=>s+t.amount,0),allExpense=period.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0),pending=period.filter(t=>t.type==="expense"&&t.status==="pending").reduce((s,t)=>s+t.amount,0);
      const balances=state.accounts.map(a=>({...a,balance:accountBalance(a.id)})),cashAvailable=balances.filter(a=>a.type!=="investment").reduce((s,a)=>s+a.balance,0),investments=balances.filter(a=>a.type==="investment").reduce((s,a)=>s+a.balance,0),cardDebt=state.cards.reduce((s,c)=>s+cardOutstanding(c.id),0),netWorth=cashAvailable+investments-cardDebt,realizedResult=paidIncome-paidExpense,savingsRate=paidIncome>0?realizedResult/paidIncome*100:0,dailyExpense=paidExpense/30,runwayDays=dailyExpense>0?Math.max(0,Math.floor(cashAvailable/dailyExpense)):null,fixedExpense=period.filter(t=>t.type==="expense"&&t.nature==="fixed").reduce((s,t)=>s+t.amount,0);
      const categories=Object.entries(period.filter(t=>t.type==="expense").reduce((o,t)=>(o[t.category]=(o[t.category]||0)+t.amount,o),{})).map(([category,value])=>({category,value})).sort((a,b)=>b.value-a.value);
      const score=Math.max(0,Math.min(1000,Math.round(520+Math.max(-250,Math.min(250,savingsRate*4))-(paidIncome>0?Math.min(180,pending/paidIncome*180):pending>0?180:0)+(runwayDays===null?20:Math.min(160,runwayDays*2)))));
      return{period,paidIncome,paidExpense,allExpense,pending,balances,cashAvailable,investments,cardDebt,netWorth,realizedResult,savingsRate,runwayDays,fixedExpense,variableExpense:allExpense-fixedExpense,categories,score};
    }
    function months(){const set=new Set(state.transactions.map(t=>monthKey(t.date)).filter(Boolean));for(let i=-12;i<=6;i++)set.add(shiftMonth(today().slice(0,7),i));set.add(selectedMonth);return [...set].sort().reverse();}
    function monthlySeries(end=selectedMonth,count=6){return Array.from({length:count},(_,i)=>shiftMonth(end,i-count+1)).map(key=>{const s=summary(key);return{key,label:shortMonth(key),income:s.paidIncome,expense:s.allExpense,result:s.paidIncome-s.allExpense};});}
    function percent(v){return `${num(v).toLocaleString("pt-BR",{maximumFractionDigits:1})}%`;}

    function transactionLine(t){const sign=t.type==="income"?"+":t.type==="expense"?"−":"",tone=t.type==="income"?"green-text":t.type==="expense"?"red-text":"blue-text";return `<div class="tx-line">${txMark(t.type)}<div class="tx-copy"><strong>${esc(t.description||t.category)}</strong><small>${dateLabel(t.date)} · ${t.status==="paid"?"Efetivado":"Pendente"}</small></div><span class="tx-value ${tone}">${sign}${money(t.amount)}</span></div>`;}
    function toast(message,type="success"){$("#toast-zone").insertAdjacentHTML("beforeend",`<div class="toast ${type}">${icon(type==="error"?"close":"check",true)}<span>${esc(message)}</span></div>`);const nodes=$$(".toast",$("#toast-zone"));const el=nodes[nodes.length-1];setTimeout(()=>{el.style.opacity="0";el.style.transform="translateX(12px)";setTimeout(()=>el.remove(),220)},3000);}

    function chartSvg(data){
      const w=720,h=235,p=24,max=Math.max(1,...data.flatMap(d=>[d.income,d.expense]));
      const point=(v,i)=>`${p+i*((w-p*2)/(data.length-1||1))},${h-p-(v/max)*(h-p*2-20)}`;

    function createTransactionSeries(draft,installments=1,recurring=1){
      if(draft.type==="transfer")return[{...draft,id:uid("tx"),paymentMethod:"transfer",status:"paid"}];
      const parts=Math.min(72,Math.max(1,Math.round(installments))),repeats=parts>1?1:Math.min(60,Math.max(1,Math.round(recurring))),count=parts>1?parts:repeats,total=Math.round(draft.amount*100),installmentGroupId=parts>1?uid("installment"):undefined,recurrenceGroupId=repeats>1?uid("recurrence"):undefined;
      return Array.from({length:count},(_,index)=>{const cents=parts>1?(index===count-1?total-Math.floor(total/count)*(count-1):Math.floor(total/count)):total;return{...draft,id:uid("tx"),amount:cents/100,date:addMonths(draft.date,index),description:parts>1?`${draft.description||draft.category} · ${index+1}/${count}`:draft.description,installmentGroupId,installmentNumber:parts>1?index+1:undefined,installmentTotal:parts>1?count:undefined,recurrenceGroupId};});
    }

      if(e.target.classList.contains("modal-backdrop")){closeModal();return;}
      const el=e.target.closest("[data-action]");if(!el)return;const action=el.dataset.action,id=el.dataset.id;
      const go=v=>{view=v;render();window.scrollTo({top:0,behavior:"smooth"})};
      if(action==="close-modal")closeModal();
      else if(action==="new-transaction")transactionModal();
      else if(action==="edit-transaction")transactionModal(id);
      else if(action==="settle-transaction")commit(s=>{s.transactions=s.transactions.map(t=>t.id===id?{...t,status:"paid",accountId:t.accountId||s.cards.find(c=>c.id===t.cardId)?.paymentAccountId||s.accounts[0]?.id}:t);return s;},"Lançamento efetivado.");
      else if(action==="delete-transaction")deleteTransaction(id);
      else if(action==="new-account")accountModal();
      else if(action==="edit-account")accountModal(id);
      else if(action==="delete-account")deleteAccount(id);
      else if(action==="new-card")cardModal();
      else if(action==="edit-card")cardModal(id);
      else if(action==="delete-card")deleteCard(id);
      else if(action==="new-goal")goalModal();
      else if(action==="edit-goal")goalModal(id);
      else if(action==="delete-goal")deleteSimple("goals",id,"Meta");
      else if(action==="new-budget")budgetModal();
      else if(action==="edit-budget")budgetModal(id);
      else if(action==="delete-budget")deleteSimple("budgets",id,"Orçamento");
      else if(action==="new-shopping")shoppingModal();
      else if(action==="toggle-shopping")purchaseModal(id);
      else if(action==="delete-shopping")deleteSimple("shoppingItems",id,"Item");
      else if(action==="new-note")noteModal();
      else if(action==="edit-note")noteModal(id);
      else if(action==="toggle-note")commit(s=>{s.notes=s.notes.map(n=>n.id===id?{...n,completed:!n.completed}:n);return s;});
      else if(action==="delete-note")deleteSimple("notes",id,"Nota");
      else if(action==="settings")settingsModal();
      else if(action==="privacy")commit(s=>{s.settings.privacyMode=!s.settings.privacyMode;return s;});
      else if(action==="undo"){const previous=undoStack.pop();if(!previous)return toast("Nenhuma alteração para desfazer.","error");state=previous;save();applyTheme();render();toast("Alteração desfeita.");}
      else if(action==="go-accounts")go("accounts");
      else if(action==="go-planning")go("planning");
      else if(action==="go-transactions")go("transactions");
      else if(action==="export-json")exportJson();
      else if(action==="export-csv")exportCsv();
      else if(action==="print-report")window.print();
      else if(action==="reset-all")confirmAction("Apagar todos os dados","Contas, cartões, lançamentos, metas, compras e notas serão removidos. Exporte um backup antes se precisar.",()=>{state=defaultState();undoStack=[];selectedMonth=today().slice(0,7);save();applyTheme();render();toast("Dados reiniciados.");});
    });
    $("#month-select").addEventListener("change",e=>{selectedMonth=e.target.value;render()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$(".modal-backdrop"))closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!$(".modal-backdrop")){e.preventDefault();const previous=undoStack.pop();if(previous){state=previous;save();applyTheme();render();toast("Alteração desfeita.")}}});
    applyTheme();save();render();
  })();
  </script>
</body>
</html>
